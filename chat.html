
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }
    .chat-box {
      height: 70vh;
      overflow-y: auto;
      padding: 15px;
      background: #fff;
      border-radius: .5rem;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
    }
    .message {
      margin-bottom: 15px;
      max-width: 75%;
    }
    .message.user {
      margin-left: auto;
      background: #0d6efd;
      color: #fff;
      border-radius: 1rem 1rem 0 1rem;
      padding: 10px 15px;
    }
    .message.bot {
      margin-right: auto;
      background: #e9ecef;
      border-radius: 1rem 1rem 1rem 0;
      padding: 10px 15px;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <!-- Заголовок -->
      <div class="card mb-3">
        <div class="card-body text-center fw-bold">
          Чат с ботом
        </div>
      </div>

      <!-- Чат -->
      <div class="chat-box mb-3" id="chatBox">
        <div class="message bot">Привет! Чем могу помочь?</div>
        <div class="message user">Хочу узнать статус заказа. Подскажи если у тебя есть какая-либо информация. Ты ведь всё знаешь и умеешь</div>
      </div>

      <!-- Форма ввода -->
      <form class="d-flex" id="chatForm">
        <input type="text" class="form-control me-2" placeholder="Введите сообщение..." id="chatInput">
        <button class="btn btn-primary">Отправить</button>
      </form>

    </div>
  </div>
</div>

<script>
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  const chatBox = document.getElementById('chatBox');

  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;

    // Добавляем сообщение пользователя
    const userMsg = document.createElement('div');
    userMsg.className = 'message user';
    userMsg.textContent = text;
    chatBox.appendChild(userMsg);

    chatInput.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // Фейковый ответ бота
    setTimeout(() => {
      const botMsg = document.createElement('div');
      botMsg.className = 'message bot';
      botMsg.textContent = 'Бот отвечает: "' + text + '"';
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 800);
  });
</script>

</body>
</html>
